services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      WASIFY_AUTH_SECRET: ${WASIFY_AUTH_SECRET:-change-me-in-production}
      DATABASE_URL: /data/wasify.db
      MODEL_PATH: /app/models/waste_model.pt
    volumes:
      - wasify_data:/data
      - ./models/waste_model.pt:/app/models/waste_model.pt:ro

  streamlit:
    build: .
    command: streamlit run app.py --server.port=8501 --server.address=0.0.0.0
    ports:
      - "8501:8501"
    environment:
      WASIFY_AUTH_SECRET: ${WASIFY_AUTH_SECRET:-change-me-in-production}
      API_BASE_URL: http://api:8000
    depends_on:
      - api

volumes:
  wasify_data:
